[package]
name = "crisp-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "crisp"
path = "src/main.rs"

[dependencies]
crisp-protocol.workspace = true
tokio.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
anyhow.workspace = true
crisp-data.workspace = true
crisp-core.workspace = true
indexmap = "2"
md-5 = "0.11.0"
rand = "0.10.3"
sha2 = "0.11.0"
flate2 = "1.1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
cfb8 = "0.8"
sha1 = { version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
gethostname = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex-lite = "0.1.9"
tokio-tungstenite = { version = "0.26", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
p12-keystore = "0.4.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
